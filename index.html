<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuru Agency | Bientôt disponible</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --primary: #e91e63; /* Rose du logo */
            --secondary: #2196f3; /* Bleu du logo */
            --accent: #7e57c2; /* Violet du logo */
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            z-index: 1;
        }

        .logo-placeholder {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--accent), var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .pillars {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .pillar {
            font-weight: 700;
            font-size: 1.2rem;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .pillar span {
            color: var(--primary);
        }

        .status {
            font-size: 1.1rem;
            color: var(--secondary);
            border: 1px solid var(--secondary);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(33, 150, 243, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(33, 150, 243, 0); }
            100% { box-shadow: 0 0 0 0 rgba(33, 150, 243, 0); }
        }

        /* Effet de lumière en arrière-plan */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent);
            filter: blur(150px);
            border-radius: 50%;
            opacity: 0.2;
            z-index: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <div class="logo-placeholder">NURU AGENCY</div>
        <h1>L'expertise à la lumière du digital</h1>
        
        <div class="pillars">
            <div class="pillar"><span>N</span>ative</div>
            <div class="pillar"><span>U</span>I-UX</div>
            <div class="pillar"><span>R</span>endering</div>
            <div class="pillar"><span>U</span>nique</div>
        </div>

        <div class="status">Site en cours de développement...</div>
    </div>
</body>
</html>
